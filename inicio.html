<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Michis Astrales — portada: descubre tu raza gatuna según tu fecha.">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="https://use.typekit.net/qzj8zld.css">
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body class="inicio">
  <main>
    <section class="Empezar" id="pt1">
      <h1>Michis Astrales</h1>
      <button id="start-btn" class="start-btn" type="button">
        <img src="./img/Patita_blanca.png" alt="Empezar">
      </button>
    </section>

    <section class="Fecha nacimiento" id="pt2">
      <p>Ingresa tu fecha de nacimiento</p>
      <input type="date" id="bdate" />
      <button id="go" class="start-btn" type="button">
        <img src="./img/Patita_blanca.png" alt="Siguiente">
      </button>
      <div id="output" aria-live="polite"></div>
    </section>

    <section class="Resultado astral" id="resultado-astral">
      <div class="resultado-card">
        <div class="resultado-header">
          <span class="resultado-badge">Tu michi astral</span>
          <h2 id="resultado-nombre">Raza</h2>
        </div>

        <div class="resultado-body">
          <div class="resultado-imagen-wrap">
            <img id="resultado-img" src="" alt="Raza gatuna" />
          </div>

          <div class="resultado-texto">
            <p class="resultado-signo">
              <strong>Signo zodiacal:</strong>
              <span id="resultado-signo">-</span>
            </p>

            <h3>Características</h3>
            <p id="resultado-caracteristicas">-</p>

            <h3>Personalidad</h3>
            <p id="resultado-personalidad">-</p>

            <h3>Más información</h3>
            <div id="resultado-fuentes">-</div>
          </div>
        </div>

        <button id="resultado-siguiente" type="button" class="resultado-btn">
          <img src="./img/Patita_blanca.png" alt="Siguiente">
        </button>
      </div>
    </section>
  </main>

  <script>
  function getSign(d){
    const m = d.getMonth() + 1;
    const day = d.getDate();
    if ((m==3 && day>=21) || (m==4 && day<=19)) return 'Aries';
    if ((m==4 && day>=20) || (m==5 && day<=20)) return 'Tauro';
    if ((m==5 && day>=21) || (m==6 && day<=20)) return 'Geminis';
    if ((m==6 && day>=21) || (m==7 && day<=22)) return 'Cancer';
    if ((m==7 && day>=23) || (m==8 && day<=22)) return 'Leo';
    if ((m==8 && day>=23) || (m==9 && day<=22)) return 'Virgo';
    if ((m==9 && day>=23) || (m==10 && day<=22)) return 'Libra';
    if ((m==10 && day>=23) || (m==11 && day<=21)) return 'Escorpio';
    if ((m==11 && day>=22) || (m==12 && day<=21)) return 'Sagitario';
    if ((m==12 && day>=22) || (m==1 && day<=19)) return 'Capricornio';
    if ((m==1 && day>=20) || (m==2 && day<=18)) return 'Acuario';
    return 'Piscis';
  }

  function seededIndex(seed, n){
    let x = seed & 0xffffffff;
    x = (x * 1664525 + 1013904223) >>> 0;
    x = (x * 1664525 + 1013904223) >>> 0;
    return x % n;
  }

  function normalize(s){
    return s.toLowerCase().normalize('NFD').replace(/[^\w\s-]/g, '').replace(/\s+/g,' ').trim();
  }

  function showResult(breedData) {
    const pt2 = document.getElementById('pt2');
    const resultado = document.getElementById('resultado-astral');
    const nombreEl = document.getElementById('resultado-nombre');
    const signoEl = document.getElementById('resultado-signo');
    const caracEl = document.getElementById('resultado-caracteristicas');
    const persoEl = document.getElementById('resultado-personalidad');
    const imgEl = document.getElementById('resultado-img');
    const fuentesEl = document.getElementById('resultado-fuentes');

    if (nombreEl) nombreEl.textContent = breedData.name || 'Raza';
    if (signoEl) signoEl.textContent = breedData.sign || '-';
    if (caracEl) caracEl.textContent = breedData.characteristics || '-';
    if (persoEl) persoEl.textContent = breedData.personality || '-';
    if (imgEl) imgEl.src = breedData.imgSrc || '';
    if (fuentesEl) fuentesEl.innerHTML = breedData.sourceHtml || '-';

    if (pt2) pt2.style.display = 'none';
    resultado.style.display = 'flex';
  }

  document.getElementById('start-btn').addEventListener('click', () => {
    const pt1 = document.getElementById('pt1');
    const pt2 = document.getElementById('pt2');
    pt1.style.display = 'none';
    pt2.style.display = 'flex';
  });

  document.getElementById('go').addEventListener('click', async () => {
    const value = document.getElementById('bdate').value;
    const output = document.getElementById('output');
    
    if (!value) {
      output.textContent = 'Indica tu fecha de nacimiento.';
      return;
    }

    output.textContent = '';
    const d = new Date(value);
    const sign = getSign(d);

    try {
      const resp = await fetch('index-source.html');
      const text = await resp.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(text, 'text/html');

      const id = sign.toLowerCase().replace(/[áéíóú]/g, x => ({á:'a',é:'e',í:'i',ó:'o',ú:'u'}[x])).replace(/ñ/g,'n');
      let para = doc.querySelector(`#${id} p`);
      let breeds = [];
      
      if (para && /Razas asociadas:/i.test(para.textContent)) {
        const m = para.textContent.match(/Razas asociadas:\s*(.*)/i);
        if (m && m[1]) {
          breeds = m[1].split(',').map(s => s.trim().replace(/\.$/,'')).filter(Boolean);
        }
      }

      if (breeds.length === 0) {
        breeds = Array.from(doc.querySelectorAll('strong')).map(s => s.textContent.trim()).filter(Boolean);
      }

      if (breeds.length === 0) {
        output.textContent = 'No se encontraron razas.';
        return;
      }

      const seed = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
      const year = d.getFullYear();
      const signSection = doc.querySelector(`#${id}`);
      
      let breed = '';
      const yearMatches = signSection
        ? Array.from(signSection.querySelectorAll('li'))
            .map(li => {
              const strong = li.querySelector('strong');
              const name = strong ? strong.textContent.trim() : '';
              const yearsText = li.textContent.match(/Años:\s*([0-9,\s]+)/i)?.[1] || '';
              const years = yearsText.split(',').map(v => Number(v.trim())).filter(n => !Number.isNaN(n));
              return { name, years };
            })
            .filter(item => item.name && item.years.includes(year))
        : [];

      if (yearMatches.length > 0) {
        breed = yearMatches[seededIndex(seed, yearMatches.length)].name;
      } else {
        breed = breeds[seededIndex(seed, breeds.length)];
      }

      const breedData = { name: breed, sign };
      localStorage.setItem('michiBreed', JSON.stringify(breedData));

      const strongs = Array.from(doc.querySelectorAll('strong'));
      const normBreed = normalize(breed);
      let strongEl = strongs.find(s => normalize(s.textContent || '') === normBreed);

      if (!strongEl) {
        strongEl = strongs.find(s => normalize(s.textContent || '').includes(normBreed) || normBreed.includes(normalize(s.textContent || '')));
      }

      if (strongEl) {
        const parentLi = strongEl.closest('li');
        const infoUl = parentLi ? parentLi.querySelector('ul') : null;
        let characteristics = '', personality = '', sourceHtml = '';
        
        if (infoUl) {
          const items = Array.from(infoUl.querySelectorAll('li'));
          items.forEach(it => {
            const text = it.textContent || '';
            if (/Características/i.test(text)) characteristics = text.replace(/Características:\s*/i, '');
            else if (/Personalidad/i.test(text)) personality = text.replace(/Personalidad:\s*/i, '');
            else if (/Fuente/i.test(text)) sourceHtml = text.replace(/Fuente:\s*/i, '');
          });
        }

        const imgSrc = parentLi ? (parentLi.querySelector('img')?.src || '') : '';
        breedData.characteristics = characteristics;
        breedData.personality = personality;
        breedData.sourceHtml = sourceHtml;
        breedData.imgSrc = imgSrc;
      }

      showResult(breedData);
    } catch (error) {
      output.textContent = 'Error al cargar la base de datos.';
      console.error(error);
    }
  });

  document.getElementById('resultado-siguiente').addEventListener('click', () => {
    window.location.href = 'quiz.html';
  });
  </script>
</body>
</html>
